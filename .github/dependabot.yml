version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # remove once a ratatui-core release after 0.1.2 contains ratatui PR #2887
    ignore:
      - dependency-name: "unicode-width"
        versions:
          - ">= 0.2.3"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "ratatui"
          - "crossterm"
          - "tree-sitter*"
        update-types:
          - minor
          - patch
