name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Run clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Run tests
        run: cargo test --workspace

  # The blame parser's design rests on a memory layout — eight bytes per line
  # (commit index plus original line),
  # and an allocation count that does not scale with the commit count. The
  # second half is only observable through a counting allocator, which belongs
  # in a bench binary rather than the lib test binary. `--test` runs each
  # benchmark once, so the assertions execute without criterion's sampling.
  bench-assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Run benchmark assertions
        run: cargo bench --bench blame_parse -- --test

  # Report only. cccc.toml sets no max-cognitive / max-cyclomatic, so a high
  # score exits 0 and this job does not fail the workflow or block a PR.
  # It has no `needs:`, so it runs beside fmt, clippy, test, and
  # bench-assertions instead of extending them.
  complexity:
    runs-on: ubuntu-latest
    # cccc install, attestation, API, or gate errors must not mark this job failed.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Measure cognitive complexity
        id: cccc
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.10.0
          path: src crates
          top-cognitive: "20"
          args: --format table
          output-file: cccc-top.txt

      - name: Publish top 20 to the job summary
        if: always()
        run: |
          {
            echo "### Top 20 functions by cognitive complexity"
            echo
            if [ -f cccc-top.txt ]; then
              echo '```text'
              cat cccc-top.txt
              echo '```'
            else
              echo "cccc produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f cccc-top.txt ]; then
            echo "Wrote $(wc -l < cccc-top.txt) lines to the job summary."
          fi
